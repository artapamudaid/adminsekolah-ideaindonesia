name: Telegram Release Notification

on:
  release:
    types: [published]

jobs:
  notify_telegram:
    name: Notify Telegram Topic on Release
    runs-on: ubuntu-latest
    steps:
      - name: Send Message to Topic
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          # Mengambil 500 karakter pertama dari release notes agar tidak terlalu panjang
          RELEASE_BODY: ${{ github.event.release.body }} 
        run: |
          # Membuat pesan dengan format Markdown Telegram
          MESSAGE="🚀 *Rilis Baru: ${RELEASE_NAME}*
          
          ${RELEASE_BODY}
          
          🔗 [Lihat Detail Rilis & Download](${RELEASE_URL})"
          
          # Mengirim menggunakan curl dengan payload JSON
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${CHAT_ID}\",
              \"message_thread_id\": ${TOPIC_ID},
              \"text\": $(echo "$MESSAGE" | jq -Rs .),
              \"parse_mode\": \"Markdown\",
              \"disable_web_page_preview\": true
            }"
